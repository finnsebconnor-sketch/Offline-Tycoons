function alignRenderingPlaneToViewportBoundaries() {
    const scaleRatio = window.devicePixelRatio || 1;
    const parentBox = canvasPlane.getBoundingClientRect();
    canvasPlane.width = parentBox.width * scaleRatio;
    canvasPlane.height = parentBox.height * scaleRatio;
    renderCtx.scale(scaleRatio, scaleRatio);
}

function pushFloatTextNotificationEntity(text, x, y, hexColor = "#fff") {
    textNotificationArrayPool.push({ outputMessage: text, x, y, structuralDriftY: -2.2, alphaDensity: 1.0, hexColor });
}

function triggerHighVelocityParticleExplosionArray(x, y, targetColorHex) {
    for (let loopIdx = 0; loopIdx < 10; loopIdx++) {
        particleArrayPool.push({
            x, y,
            vX: (Math.random() - 0.5) * 7,
            vY: (Math.random() - 0.5) * 7,
            squareSize: Math.random() * 6 + 2,
            alphaDensity: 1.0,
            targetColorHex
        });
    }
}

/* ============================================================================
   CANVAS RENDERING ENGINE AND RECURSION PIPELINE LOOPS
   ============================================================================ */
function frameExecutionPipelineProcessCycle() {
    if (!activeSession) return;
    
    const themeStyleRef = VECTOR_THEME_COLOR_SCHEMAS[activeSession.theme] || VECTOR_THEME_COLOR_SCHEMAS.pizza;
    const modelReference = globalPersistenceState.worldState[activeSession.id];
    
    renderCtx.fillStyle = themeStyleRef.floor;
    renderCtx.fillRect(0, 0, canvasPlane.width, canvasPlane.height);
    
    renderCtx.strokeStyle = themeStyleRef.line;
    renderCtx.lineWidth = 1;
    const networkGridSpacer = 60;
    for (let x = 0; x < canvasPlane.width; x += networkGridSpacer) {
        renderCtx.beginPath(); renderCtx.moveTo(x, 0); renderCtx.lineTo(x, canvasPlane.height); renderCtx.stroke();
    }
    for (let y = 0; y < canvasPlane.height; y += networkGridSpacer) {
        renderCtx.beginPath(); renderCtx.moveTo(0, y); renderCtx.lineTo(canvasPlane.width, y); renderCtx.stroke();
    }
    
    if (modelReference.aiAutomated) {
        const structuralProcureOptions = [
            { key: "assemblerLines", priceTarget: 100 * modelReference.modules.assemblerLines },
            { key: "engineClock", priceTarget: 150 * modelReference.modules.engineClock },
            { key: "materialMultiplier", priceTarget: 200 * modelReference.modules.materialMultiplier },
            { key: "workerDrones", priceTarget: 350 * (modelReference.modules.workerDrones + 1) }
        ];
        
        structuralProcureOptions.forEach(option => {
            if (modelReference.localCash >= option.priceTarget) {
                modelReference.localCash -= option.priceTarget;
                modelReference.modules[option.key] += 1;
                pushFloatTextNotificationEntity("AI HARDWARE OPTIMIZATION", 500, 220, resolveCssVariableHexCodeLookup("--quantum-cyan"));
                configureIndustrialSpatialTopography(activeSession);
                reconstructInfrastructureModuleUIControlsDrawer();
                commitApplicationConfigurationPersistence();
            }
        });

        let targetAscensionCostValue = 300 * modelReference.tierLevel;
        if (modelReference.localCash >= targetAscensionCostValue) {
            modelReference.localCash -= targetAscensionCostValue;
            modelReference.tierLevel += 1;
            pushFloatTextNotificationEntity("AI LAYER ASCENSION", 260, 160, resolveCssVariableHexCodeLookup("--quantum-emerald"));
            document.getElementById("levelLabel").innerText = modelReference.tierLevel;
            configureIndustrialSpatialTopography(activeSession);
            commitApplicationConfigurationPersistence();
        }
    }

    spatialIndustrialConveyors.forEach(conveyor => {
        renderCtx.fillStyle = "#090d16";
        renderCtx.fillRect(conveyor.x, conveyor.y, conveyor.widthExtent, conveyor.heightExtent);
        renderCtx.strokeStyle = "#1e293b";
        renderCtx.lineWidth = 4;
        renderCtx.strokeRect(conveyor.x, conveyor.y, conveyor.widthExtent, conveyor.heightExtent);
        
        renderCtx.fillStyle = "rgba(56, 189, 248, 0.06)";
        let animatedTickerShiftX = (Date.now() / 12) % 50;
        for (let lx = conveyor.x + animatedTickerShiftX; lx < conveyor.x + conveyor.widthExtent; lx += 50) {
            renderCtx.fillRect(lx, conveyor.y, 8, conveyor.heightExtent);
        }
        
        renderCtx.fillStyle = themeStyleRef.line;
        renderCtx.fillRect(conveyor.x - 20, conveyor.y - 20, 50, conveyor.heightExtent + 40);
        renderCtx.strokeStyle = themeStyleRef.accent;
        renderCtx.strokeRect(conveyor.x - 20, conveyor.y - 20, 50, conveyor.heightExtent + 40);
        
        renderCtx.fillStyle = "#020408";
        renderCtx.fillRect(conveyor.x + conveyor.widthExtent - 30, conveyor.y - 15, 50, conveyor.heightExtent + 30);
        renderCtx.strokeStyle = resolveCssVariableHexCodeLookup("--quantum-emerald");
        renderCtx.strokeRect(conveyor.x + conveyor.widthExtent - 30, conveyor.y - 15, 50, conveyor.heightExtent + 30);
    });

    if (Math.random() < 0.022 * modelReference.modules.engineClock) {
        operationalActiveResourceDrops.push({
            x: 270,
            y: 385,
            progressStepValue: 0,
            financialYieldFactor: activeSession.baseIncome * modelReference.modules.materialMultiplier,
            bounceRadianDelta: 0
        });
    }

    for (let dropIdx = operationalActiveResourceDrops.length - 1; dropIdx >= 0; dropIdx--) {
        let resourceNode = operationalActiveResourceDrops[dropIdx];
        resourceNode.progressStepValue += 2.2 * modelReference.modules.engineClock;
        resourceNode.x = 270 + resourceNode.progressStepValue;
        resourceNode.bounceRadianDelta += 0.18;
        
        renderCtx.beginPath();
        let responsiveElasticBounceRadius = 15 + Math.sin(resourceNode.bounceRadianDelta) * 3;
        renderCtx.arc(resourceNode.x, resourceNode.y, responsiveElasticBounceRadius, 0, Math.PI * 2);
        renderCtx.fillStyle = themeStyleRef.item;
        renderCtx.fill();
        renderCtx.strokeStyle = themeStyleRef.flash;
        renderCtx.lineWidth = 3;
        renderCtx.stroke();
        
        renderCtx.fillStyle = "#ffffff";
        renderCtx.beginPath(); renderCtx.arc(resourceNode.x - 6, resourceNode.y - 5, 4, 0, Math.PI * 2); renderCtx.fill();

        if (resourceNode.x >= 715) {
            let optimizedCalculatedPayoutValue = Math.floor(resourceNode.financialYieldFactor * (1 + (modelReference.tierLevel * 0.3)));
            modelReference.localCash += optimizedCalculatedPayoutValue;
            pushFloatTextNotificationEntity(`+$${optimizedCalculatedPayoutValue}`, resourceNode.x, resourceNode.y - 25, resolveCssVariableHexCodeLookup("--quantum-emerald"));
            triggerHighVelocityParticleExplosionArray(resourceNode.x, resourceNode.y, themeStyleRef.accent);
            operationalActiveResourceDrops.splice(dropIdx, 1);
            document.getElementById("lblLocalSimCash").innerText = Math.floor(modelReference.localCash).toLocaleString();
        }
    }

    continuousAutomatedWorkerDrones.forEach(drone => {
        if (drone.currentCycleState === "cargo_load_run") {
            drone.xPosition += drone.velocityFactor;
            if (drone.xPosition >= drone.unloadingTerminalMaxX) {
                drone.currentCycleState = "return_dock_run";
            }
        } else {
            drone.xPosition -= drone.velocityFactor;
            if (drone.xPosition <= drone.dockingBoundaryMinX) {
                drone.currentCycleState = "cargo_load_run";
                operationalActiveResourceDrops.push({
                    x: 270, y: 385, progressStepValue: 0,
                    financialYieldFactor: activeSession.baseIncome * modelReference.modules.materialMultiplier * 1.6,
                    bounceRadianDelta: 0
                });
            }
        }
        
        renderCtx.fillStyle = resolveCssVariableHexCodeLookup("--quantum-cyan");
        renderCtx.beginPath();
        renderCtx.moveTo(drone.xPosition, drone.yPosition - 15);
        renderCtx.lineTo(drone.xPosition + 15, drone.yPosition + 8);
        renderCtx.lineTo(drone.xPosition - 15, drone.yPosition + 8);
        renderCtx.closePath();
        renderCtx.fill();
        
        renderCtx.fillStyle = "rgba(56, 189, 248, 0.45)";
        renderCtx.fillRect(drone.xPosition - 5, drone.yPosition + 12, 10, 5);
    });

    structuralMatrixInteractiveNodes.forEach(node => {
        let cyclicPulseGlowRadius = node.radius + Math.sin(Date.now() / 140) * 5;
        let focalPointGradient = renderCtx.createRadialGradient(node.x, node.y, node.radius - 10, node.x, node.y, cyclicPulseGlowRadius + 12);
        focalPointGradient.addColorStop(0, node.colorCode + "35");
        focalPointGradient.addColorStop(1, "transparent");
        renderCtx.fillStyle = focalPointGradient;
        renderCtx.beginPath(); renderCtx.arc(node.x, node.y, cyclicPulseGlowRadius + 15, 0, Math.PI * 2); renderCtx.fill();

        renderCtx.beginPath();
        renderCtx.arc(node.x, node.y, node.radius, 0, Math.PI * 2);
        renderCtx.fillStyle = "rgba(1, 2, 4, 0.96)";
        renderCtx.fill();
        renderCtx.strokeStyle = node.colorCode;
        renderCtx.lineWidth = 4;
        renderCtx.stroke();

        renderCtx.fillStyle = "#ffffff";
        renderCtx.font = "bold 12px ui-monospace";
        renderCtx.textAlign = "center";
        renderCtx.fillText(node.headline, node.x, node.y - 6);
        
        renderCtx.fillStyle = resolveCssVariableHexCodeLookup("--quantum-text-secondary");
        renderCtx.font = "9px ui-monospace";
        renderCtx.fillText(node.subtextLabel, node.x, node.y + 16);
    });

    for (let textIdx = textNotificationArrayPool.length - 1; textIdx >= 0; textIdx--) {
let dynamicText = textNotificationArrayPool[textIdx];
dynamicText.y += dynamicText.structuralDriftY;
dynamicText.alphaDensity -= 0.018;
if (dynamicText.alphaDensity <= 0) {
textNotificationArrayPool.splice(textIdx, 1);
} else {
renderCtx.save();
renderCtx.globalAlpha = dynamicText.alphaDensity;
renderCtx.fillStyle = dynamicText.hexColor;
renderCtx.font = "bold 15px ui-monospace";
renderCtx.textAlign = "center";
renderCtx.fillText(dynamicText.outputMessage, dynamicText.x, dynamicText.y);
renderCtx.restore();
}
}
for (let particleIdx = particleArrayPool.length - 1; particleIdx >= 0; particleIdx--) {
let explicitParticle = particleArrayPool[particleIdx];
