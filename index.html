<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tycoon World</title>

<style>
*{box-sizing:border-box}

:root{
    --bg:#070b14;
    --panel:#101827;
    --panel2:#162235;
    --border:#263852;
    --text:#fff;
    --muted:#91a4bd;
    --accent:#5de2ff;
}

body{
    margin:0;
    background:
        radial-gradient(circle at 20% 10%,#182d48 0,transparent 30%),
        radial-gradient(circle at 80% 80%,#241943 0,transparent 30%),
        #050810;
    color:var(--text);
    font-family:Arial,sans-serif;
    min-height:100vh;
}

button{
    border:0;
    border-radius:12px;
    padding:12px 16px;
    font-weight:800;
    cursor:pointer;
    transition:.18s;
}

button:hover{
    transform:translateY(-2px);
}

button:active{
    transform:scale(.96);
}

header{
    height:72px;
    background:#080f1dE8;
    border-bottom:1px solid #26364f;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 24px;
    position:sticky;
    top:0;
    z-index:50;
    backdrop-filter:blur(14px);
}

.logo{
    font-size:25px;
    font-weight:900;
}

.logo span{
    color:#59dcff;
}

header button{
    background:#18263b;
    color:white;
}

main{
    max-width:1350px;
    margin:auto;
    padding:25px;
}

.hero{
    text-align:center;
    padding:50px 10px 35px;
}

.hero h1{
    margin:0;
    font-size:clamp(48px,8vw,90px);
    background:linear-gradient(90deg,#fff,#62e8ff,#9c7cff);
    color:transparent;
    background-clip:text;
    -webkit-background-clip:text;
}

.hero p{
    color:#9badc3;
    font-size:18px;
}

.badge{
    display:inline-block;
    background:#142b43;
    border:1px solid #2b5574;
    color:#79e6ff;
    padding:7px 12px;
    border-radius:20px;
    font-size:12px;
    font-weight:bold;
    margin-bottom:15px;
}

/* GAME SELECT */

.games{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:16px;
}

.game-card{
    min-height:270px;
    padding:20px;
    border:1px solid #273a55;
    border-radius:22px;
    background:
        linear-gradient(145deg,#14243a,#0c1422);
    position:relative;
    overflow:hidden;
    transition:.25s;
}

.game-card:hover{
    transform:translateY(-8px);
    border-color:#61ddff;
    box-shadow:0 20px 50px #0008;
}

.game-card::after{
    content:"";
    position:absolute;
    width:150px;
    height:150px;
    right:-60px;
    bottom:-60px;
    border-radius:50%;
    background:#5de2ff16;
}

.game-icon{
    font-size:55px;
}

.game-card h2{
    margin:12px 0 7px;
}

.game-card p{
    color:#91a5bd;
    min-height:45px;
    font-size:14px;
}

.play{
    width:100%;
    background:white;
    color:#08101c;
    margin-top:10px;
}

.offline{
    position:absolute;
    right:12px;
    top:12px;
    padding:5px 8px;
    border-radius:7px;
    font-size:10px;
    background:#15304a;
    color:#85e8ff;
}

/* GAME */

.hidden{
    display:none!important;
}

.game-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
    flex-wrap:wrap;
    margin-bottom:20px;
}

.game-top h1{
    margin:0 0 5px;
}

.subtitle{
    color:#91a5bd;
}

.top-buttons{
    display:flex;
    gap:8px;
}

.back{
    background:#17263b;
    color:white;
}

.reset{
    background:#3b1c27;
    color:#ff9aaa;
}

.game-layout{
    display:grid;
    grid-template-columns:1.5fr .75fr;
    gap:18px;
}

.world{
    min-height:570px;
    border-radius:26px;
    position:relative;
    overflow:hidden;
    border:1px solid #30445e;
    background:#172333;
    box-shadow:0 20px 60px #0005;
}

.world-header{
    position:absolute;
    left:18px;
    top:18px;
    z-index:20;
    padding:10px 14px;
    border-radius:12px;
    background:#07101ddd;
    border:1px solid #ffffff18;
    font-weight:bold;
}

.stats-panel{
    background:#0d1726;
    border:1px solid #293c56;
    border-radius:22px;
    padding:17px;
}

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
}

.stat{
    background:#142238;
    border-radius:12px;
    padding:11px;
}

.stat strong{
    display:block;
    font-size:18px;
}

.stat small{
    color:#8297af;
}

.upgrade{
    background:#111e30;
    border:1px solid #293e59;
    border-radius:15px;
    padding:13px;
    margin-top:10px;
}

.upgrade h3{
    margin:0 0 5px;
}

.upgrade p{
    color:#8fa4bc;
    font-size:13px;
}

.upgrade button{
    width:100%;
    background:#21bd83;
    color:white;
}

.upgrade button:disabled{
    background:#29384b;
    color:#77879b;
    cursor:not-allowed;
}

.log{
    height:105px;
    overflow:auto;
    margin-top:12px;
    background:#07101b;
    border-radius:12px;
    padding:10px;
    color:#8ca3ba;
    font-size:12px;
}

/* GENERIC WORLD OBJECTS */

.character{
    position:absolute;
    z-index:15;
    font-size:40px;
    animation:walk 5s ease-in-out infinite;
}

.char1{left:15%;bottom:17%}
.char2{left:48%;bottom:28%;animation-delay:-2s}
.char3{right:15%;bottom:18%;animation-delay:-3.5s}

@keyframes walk{
    0%,100%{transform:translateX(-20px)}
    50%{transform:translateX(70px) translateY(-5px)}
}

/* PIZZA */

.pizza-world{
    background:
        linear-gradient(#542b24 0 62%,#332019 62%);
}

.pizza-kitchen{
    position:absolute;
    left:8%;
    right:8%;
    bottom:18%;
    height:44%;
    background:#c56b3c;
    border:7px solid #74351f;
    border-radius:18px;
}

.oven{
    position:absolute;
    left:8%;
    top:15%;
    width:27%;
    height:70%;
    background:#222831;
    border-radius:14px;
    border:5px solid #10151b;
}

.oven::after{
    content:"🔥";
    position:absolute;
    font-size:40px;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
}

.pizza-table{
    position:absolute;
    right:8%;
    top:20%;
    width:40%;
    height:18%;
    background:#8b4d28;
    border-radius:10px;
}

.pizza{
    position:absolute;
    width:115px;
    height:115px;
    border-radius:50%;
    background:#e7a13d;
    border:15px solid #d77b2e;
    box-shadow:inset 0 0 0 5px #ffe09a;
    left:50%;
    top:48%;
    transform:translate(-50%,-50%);
    cursor:pointer;
    transition:.15s;
}

.pizza:hover{
    transform:translate(-50%,-50%) scale(1.08);
}

/* COOKIE */

.cookie-world{
    background:
        radial-gradient(circle at 50% 50%,#7d4a24,#2a160d);
}

.big-cookie{
    position:absolute;
    left:50%;
    top:52%;
    transform:translate(-50%,-50%);
    width:230px;
    height:230px;
    border-radius:50%;
    background:
        radial-gradient(circle at 30% 30%,#6b351b 0 5px,transparent 6px),
        radial-gradient(circle at 70% 25%,#6b351b 0 6px,transparent 7px),
        radial-gradient(circle at 50% 70%,#6b351b 0 6px,transparent 7px),
        radial-gradient(circle at 25% 70%,#6b351b 0 5px,transparent 6px),
        #d58a42;
    border:10px solid #8c4e23;
    box-shadow:0 20px 40px #0008,inset 0 0 30px #fff2;
    cursor:pointer;
}

.big-cookie:active{
    transform:translate(-50%,-50%) scale(.94);
}

/* FOOTBALL */

.football-world{
    background:
        linear-gradient(#5fb9ed 0 45%,#287a3d 45% 100%);
}

.pitch{
    position:absolute;
    left:8%;
    right:8%;
    bottom:10%;
    height:55%;
    background:#25833e;
    border:5px solid white;
    border-radius:15px;
}

.pitch::before{
    content:"";
    position:absolute;
    left:50%;
    top:0;
    bottom:0;
    width:4px;
    background:white;
}

.ball{
    position:absolute;
    font-size:45px;
    left:48%;
    top:45%;
    animation:ballmove 3s infinite alternate ease-in-out;
}

@keyframes ballmove{
    to{transform:translate(120px,-40px) rotate(360deg)}
}

/* GAMING */

.gaming-world{
    background:
        radial-gradient(circle at 50% 20%,#44329a,#101022 60%);
}

.gaming-room{
    position:absolute;
    left:8%;
    right:8%;
    bottom:10%;
    height:58%;
    background:#15152b;
    border:5px solid #312b67;
    border-radius:18px;
}

.setup{
    position:absolute;
    bottom:15%;
    font-size:70px;
    animation:float 2.5s infinite ease-in-out;
}

.setup1{left:10%}
.setup2{left:43%;animation-delay:-.8s}
.setup3{right:10%;animation-delay:-1.6s}

@keyframes float{
    50%{transform:translateY(-8px)}
}

/* HOTEL */

.hotel-world{
    background:
        linear-gradient(#80c9ed 0 38%,#3e8f50 38%);
}

.hotel-building{
    position:absolute;
    left:20%;
    right:20%;
    bottom:10%;
    height:65%;
    background:#e8dfc8;
    border:8px solid #725e45;
    border-radius:12px 12px 0 0;
}

.window{
    position:absolute;
    width:35px;
    height:45px;
    background:#6fd5ed;
    border:4px solid #574a3b;
}

/* SUPERMARKET */

.shop-world{
    background:
        linear-gradient(#9ed8ed 0 35%,#6d8e54 35% 100%);
}

.shop{
    position:absolute;
    left:8%;
    right:8%;
    bottom:12%;
    height:58%;
    background:#e9e9e9;
    border:7px solid #555;
    border-radius:12px;
}

.shelf{
    position:absolute;
    width:22%;
    height:48%;
    bottom:18%;
    background:#9b6339;
    border:5px solid #5d3921;
}

.s1{left:8%}
.s2{left:39%}
.s3{right:8%}

/* RACING */

.racing-world{
    background:#292d36;
}

.track{
    position:absolute;
    left:8%;
    right:8%;
    top:23%;
    bottom:10%;
    border:45px solid #424752;
    border-radius:50%;
}

.track::after{
    content:"";
    position:absolute;
    inset:-23px;
    border:4px dashed white;
    border-radius:50%;
}

.car{
    position:absolute;
    font-size:45px;
    left:45%;
    top:40%;
    animation:race 4s linear infinite;
}

@keyframes race{
    0%{transform:translate(-100px,0)}
    25%{transform:translate(100px,-80px)}
    50%{transform:translate(150px,60px)}
    75%{transform:translate(-100px,100px)}
    100%{transform:translate(-100px,0)}
}

/* CLOTHING */

.clothing-world{
    background:
        linear-gradient(135deg,#e5d4bd,#9b7c62);
}

.shop-rack{
    position:absolute;
    left:15%;
    right:15%;
    bottom:17%;
    height:48%;
    background:#6d4834;
    border-radius:12px;
}

.shirt{
    position:absolute;
    font-size:85px;
    top:25%;
}

/* FISHING */

.fishing-world{
    background:
        linear-gradient(#62bce5 0 42%,#247ca5 42% 100%);
}

.boat{
    position:absolute;
    left:35%;
    top:50%;
    font-size:110px;
    animation:boat 3s infinite ease-in-out;
}

@keyframes boat{
    50%{transform:translateY(-8px) rotate(-2deg)}
}

.fish{
    position:absolute;
    font-size:35px;
    animation:fish 5s linear infinite;
}

.fish1{left:15%;top:65%}
.fish2{left:55%;top:72%;animation-delay:-2s}
.fish3{right:15%;top:60%;animation-delay:-4s}

@keyframes fish{
    50%{transform:translateX(100px)}
}

/* ISLAND */

.island-world{
    background:
        linear-gradient(#63c8ed 0 52%,#2496ad 52%);
}

.island{
    position:absolute;
    left:12%;
    right:12%;
    bottom:8%;
    height:48%;
    background:#61b84c;
    border-radius:50%;
}

.palm{
    position:absolute;
    font-size:85px;
    bottom:30%;
}

.palm1{left:15%}
.palm2{right:15%}

/* POPUPS */

.money-pop{
    position:absolute;
    z-index:100;
    color:#ffe46b;
    font-weight:900;
    pointer-events:none;
    animation:moneyUp 1s forwards;
}

@keyframes moneyUp{
    to{
        transform:translateY(-60px);
        opacity:0;
    }
}

.toast{
    position:fixed;
    left:50%;
    top:25%;
    transform:translateX(-50%);
    background:#101c2d;
    border:2px solid #5de2ff;
    padding:22px 30px;
    border-radius:20px;
    z-index:200;
    text-align:center;
    box-shadow:0 20px 60px #000b;
}

.toast h2{
    margin:0 0 5px;
}

/* RESPONSIVE */

@media(max-width:1100px){
    .games{
        grid-template-columns:repeat(3,1fr);
    }

    .game-layout{
        grid-template-columns:1fr;
    }
}

@media(max-width:650px){
    .games{
        grid-template-columns:repeat(2,1fr);
    }

    .world{
        min-height:430px;
    }

    .big-cookie{
        width:180px;
        height:180px;
    }
}

@media(max-width:450px){
    .games{
        grid-template-columns:1fr;
    }

    main{
        padding:14px;
    }

    header{
        padding:0 14px;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">🎮 TYCOON <span>WORLD</span></div>
    <button onclick="showHome()">GAMES</button>
</header>

<main id="home">

    <section class="hero">
        <div class="badge">10 GAMES • OFFLINE • FREE</div>
        <h1>TYCOON WORLD</h1>
        <p>Build businesses, click, collect, upgrade and become a tycoon.</p>
    </section>

    <section class="games" id="games"></section>

</main>


<main id="game" class="hidden"></main>


<script>

/* =====================================
   GAME DATA
===================================== */

const games = {

    pizza:{
        icon:"🍕",
        name:"Pizza Tycoon",
        description:"Make pizzas, serve customers and build your pizza empire.",
        type:"pizza",
        color:"#ff7043"
    },

    cookie:{
        icon:"🍪",
        name:"Cookie Clicker",
        description:"Click cookies, hire bakers and build a cookie empire.",
        type:"cookie",
        color:"#d89048"
    },

    football:{
        icon:"⚽",
        name:"Football Tycoon",
        description:"Build your club, train players and upgrade your stadium.",
        type:"football",
        color:"#42d17a"
    },

    gaming:{
        icon:"🎮",
        name:"Gaming Tycoon",
        description:"Build gaming rooms and attract more players.",
        type:"gaming",
        color:"#9d72ff"
    },

    hotel:{
        icon:"🏨",
        name:"Hotel Tycoon",
        description:"Build rooms, welcome guests and grow your hotel.",
        type:"hotel",
        color:"#64c7e8"
    },

    supermarket:{
        icon:"🛒",
        name:"Supermarket Tycoon",
        description:"Stock shelves, serve shoppers and expand your store.",
        type:"supermarket",
        color:"#73c94c"
    },

    racing:{
        icon:"🏎️",
        name:"Racing Tycoon",
        description:"Run races, upgrade cars and build the ultimate track.",
        type:"racing",
        color:"#ff4d5e"
    },

    clothing:{
        icon:"👕",
        name:"Clothing Tycoon",
        description:"Create clothes, sell collections and grow your brand.",
        type:"clothing",
        color:"#e89bff"
    },

    fishing:{
        icon:"🎣",
        name:"Fishing Tycoon",
        description:"Catch fish, upgrade boats and discover new waters.",
        type:"fishing",
        color:"#45c9ed"
    },

    island:{
        icon:"🏝️",
        name:"Island Tycoon",
        description:"Build attractions and turn an island into a resort.",
        type:"island",
        color:"#54d6a0"
    }

};


/* =====================================
   UPGRADE DATA
===================================== */

const upgradeSets = {

    pizza:[
        ["Better Oven",50,2],
        ["Pizza Chef",150,7],
        ["Delivery Scooter",500,24],
        ["Second Restaurant",1500,80],
        ["Pizza Factory",5000,250],
        ["Pizza Empire",15000,800]
    ],

    cookie:[
        ["Cursor",15,1],
        ["Grandma",100,5],
        ["Cookie Farm",500,20],
        ["Cookie Factory",2000,80],
        ["Cookie Mine",8000,300],
        ["Cookie Portal",30000,1200]
    ],

    football:[
        ["Training Cone",50,2],
        ["Youth Academy",200,8],
        ["Better Players",700,30],
        ["Stadium Stand",2500,100],
        ["Big Stadium",10000,400],
        ["Champions League",40000,1600]
    ],

    gaming:[
        ["Gaming PC",50,2],
        ["Console Setup",180,8],
        ["Gaming Room",600,28],
        ["VR Zone",2500,110],
        ["Esports Arena",10000,450],
        ["Gaming Empire",40000,1800]
    ],

    hotel:[
        ["Small Room",50,2],
        ["Double Room",180,8],
        ["Luxury Room",600,25],
        ["Hotel Floor",2500,100],
        ["Penthouse",10000,450],
        ["Resort Tower",40000,1800]
    ],

    supermarket:[
        ["Shelf",50,2],
        ["Checkout",180,8],
        ["Stock Room",600,28],
        ["New Aisle",2500,110],
        ["Second Store",10000,450],
        ["Supermarket Chain",40000,1800]
    ],

    racing:[
        ["Go-Kart",50,2],
        ["Fast Car",200,8],
        ["Race Event",700,30],
        ["Track Upgrade",2500,120],
        ["Grand Prix",10000,500],
        ["Racing Empire",40000,2000]
    ],

    clothing:[
        ["T-Shirt",50,2],
        ["Designer",200,8],
        ["Clothing Rack",700,30],
        ["Fashion Store",2500,120],
        ["Fashion Show",10000,500],
        ["Global Brand",40000,2000]
    ],

    fishing:[
        ["Fishing Rod",50,2],
        ["Small Boat",180,8],
        ["Fishing Crew",600,28],
        ["Large Boat",2500,110],
        ["Fishing Fleet",10000,450],
        ["Ocean Empire",40000,1800]
    ],

    island:[
        ["Beach Hut",50,2],
        ["Restaurant",200,8],
        ["Tourist Attraction",700,30],
        ["Hotel",2500,120],
        ["Theme Park",10000,500],
        ["Island Resort",40000,2000]
    ]

};


/* =====================================
   STATE
===================================== */

let current = null;
let state = null;
let timer = null;


/* =====================================
   HOME CARDS
===================================== */

function buildCards(){

    const container =
        document.getElementById("games");

    for(const id in games){

        const g = games[id];

        container.innerHTML += `

            <article class="game-card">

                <div class="offline">
                    OFFLINE
                </div>

                <div class="game-icon">
                    ${g.icon}
                </div>

                <h2>
                    ${g.name}
                </h2>

                <p>
                    ${g.description}
                </p>

                <button
                    class="play"
                    onclick="startGame('${id}')"
                >
                    PLAY NOW
                </button>

            </article>

        `;

    }

}


/* =====================================
   SAVE / LOAD
===================================== */

function newState(){

    return {

        money:100,

        owned:[
            0,0,0,0,0,0
        ],

        level:1,

        clicks:0,

        total:0

    };

}


function load(id){

    try{

        const saved =
            localStorage.getItem(
                "TW_" + id
            );

        if(saved){

            return JSON.parse(saved);

        }

    }catch(e){}

    return newState();

}


function save(){

    try{

        localStorage.setItem(
            "TW_" + current,
            JSON.stringify(state)
        );

    }catch(e){}

}


/* =====================================
   INCOME
===================================== */

function income(){

    const list =
        upgradeSets[current];

    let total = 0;

    list.forEach((u,i)=>{

        total +=
            state.owned[i] *
            u[2];

    });

    return total;

}


/* =====================================
   START
===================================== */

function startGame(id){

    current = id;

    state = load(id);

    document
        .getElementById("home")
        .classList.add("hidden");

    document
        .getElementById("game")
        .classList.remove("hidden");

    render();

    clearInterval(timer);

    timer =
        setInterval(tick,1000);

    window.scrollTo(0,0);

}


/* =====================================
   WORLD
===================================== */

function worldHTML(){

    const type =
        games[current].type;

    if(type==="pizza"){

        return `

            <div class="world pizza-world">

                <div class="world-header">
                    🍕 PIZZA KITCHEN
                </div>

                <div class="pizza-kitchen">

                    <div class="oven"></div>

                    <div class="pizza-table"></div>

                </div>

                <div class="pizza"
                     onclick="pizzaClick()">
                </div>

                <div class="character char1">
                    👨‍🍳
                </div>

                <div class="character char2">
                    🍕
                </div>

                <div class="character char3">
                    🧑
                </div>

            </div>

        `;

    }


    if(type==="cookie"){

        return `

            <div class="world cookie-world">

                <div class="world-header">
                    🍪 COOKIE FACTORY
                </div>

                <div
                    class="big-cookie"
                    onclick="cookieClick()"
                    title="Click the cookie!"
                ></div>

            </div>

        `;

    }


    if(type==="football"){

        return `

            <div class="world football-world">

                <div class="world-header">
                    ⚽ CLUB STADIUM
                </div>

                <div class="pitch"></div>

                <div class="ball">
                    ⚽
                </div>

/* =====================================
   RENDER
===================================== */

function render(){

    const g =
        games[current];

    const upgrades =
        upgradeSets[current];

    const inc =
        income();

    let html = "";


    upgrades.forEach((u,i)=>{

        const cost =
            Math.floor(
                u[1] *
                Math.pow(
                    1.3,
                    state.owned[i]
                )
            );

        html += `

            <div class="upgrade">

                <h3>
                    ${u[0]}
                </h3>

                <p>
                    Owned:
                    ${state.owned[i]}
                    · +${u[2]}/sec
                </p>

                <button
                    onclick="buy(${i})"
                    ${state.money < cost ? "disabled":""}
                >
                    Buy for
                    $${cost.toLocaleString()}
                </button>

            </div>

        `;

    });


    document.getElementById("game").innerHTML = `

        <div class="game-top">

            <div>

                <h1>
                    ${g.icon}
                    ${g.name}
                </h1>

                <div class="subtitle">
                    ${g.description}
                </div>

            </div>

            <div class="top-buttons">

                <button
                    class="back"
                    onclick="showHome()"
                >
                    ← GAMES
                </button>

                <button
                    class="reset"
                    onclick="resetGame()"
                >
                    RESET
                </button>

            </div>

        </div>


        <div class="game-layout">

            <div>

                ${worldHTML()}

                <div
                    class="stats-panel"
                    style="margin-top:15px"
                >

                    <strong>
                        Business Activity
                    </strong>

                    <div
                        class="log"
                        id="log"
                    >
                        Your business is open.<br>
                        Keep upgrading to grow faster.
                    </div>

                </div>

            </div>


            <aside class="stats-panel">

                <div class="stats">

                    <div class="stat">

                        <strong id="cash">
                            ${money(state.money)}
                        </strong>

                        <small>
                            CASH
                        </small>

                    </div>

                    <div class="stat">

                        <strong id="income">
                            ${money(inc)}
                        </strong>

                        <small>
                            PER SEC
                        </small>

                    </div>

                    <div class="stat">

                        <strong id="level">
                            LV ${state.level}
                        </strong>

                        <small>
                            LEVEL
                        </small>

                    </div>

                </div>


                ${html}

            </aside>

        </div>

    `;

}


/* =====================================
   MONEY
===================================== */

function money(n){

    return "$" +
        Math.floor(n)
        .toLocaleString();

}


/* =====================================
   BUY
===================================== */

function buy(i){

    const u =
        upgradeSets[current][i];

    const cost =
        Math.floor(
            u[1] *
            Math.pow(
                1.3,
                state.owned[i]
            )
        );

    if(state.money < cost){

        addLog("You need more money!");

        return;

    }

    state.money -= cost;

    state.owned[i]++;

    const oldLevel =
        state.level;

    const total =
        state.owned.reduce(
            (a,b)=>a+b,
            0
        );

    state.level =
        1 +
        Math.floor(total/2);

    save();

    render();

    if(state.level > oldLevel){

        levelUp();

    }

}


/* =====================================
   TICK
===================================== */

function tick(){

    const inc =
        income();

    state.money += inc;

    state.total += inc;

    save();


    const cash =
        document.getElementById("cash");

    const incomeBox =
        document.getElementById("income");


    if(cash)
        cash.textContent =
            money(state.money);

    if(incomeBox)
        incomeBox.textContent =
            money(inc);


    if(inc > 0){

        popup(
            "+" + money(inc)
        );

    }

}


/* =====================================
   COOKIE CLICKER
===================================== */

function cookieClick(){

    state.clicks++;

    state.money++;

    state.total++;

    popup("+$1 🍪");

    save();

    const cash =
        document.getElementById("cash");

    if(cash)
        cash.textContent =
            money(state.money);

}


/* =====================================
   PIZZA CLICK
===================================== */

function pizzaClick(){

    const value =
        2 +
        state.owned[0] * 2;

    state.money += value;

    state.total += value;

    popup("+" + money(value) + " 🍕");

    addLog(
        "Pizza sold for " +
        money(value) +
        "!"
    );

    save();

    const cash =
        document.getElementById("cash");

    if(cash)
        cash.textContent =
            money(state.money);

}


/* =====================================
   POPUP
===================================== */

function popup(text){

    const world =
        document.querySelector(".world");

    if(!world)
        return;


    const el =
        document.createElement("div");

    el.className =
        "money-pop";

    el.textContent =
        text;

    el.style.left =
        (30 + Math.random()*40) +
        "%";

    el.style.top =
        (45 + Math.random()*20) +
        "%";

    world.appendChild(el);

    setTimeout(
        ()=>el.remove(),
        1000
    );

}


/* =====================================
   LOG
===================================== */

function addLog(text){

    const log =
        document.getElementById("log");

    if(!log)
        return;

    log.innerHTML =
        text +
        "<br>" +
        log.innerHTML;

}


/* =====================================
   LEVEL UP
===================================== */

function levelUp(){

    const box =
        document.createElement("div");

    box.className =
        "toast";

    box.innerHTML = `

        <h2>
            🎉 LEVEL UP!
        </h2>

        <div>
            You reached Level ${state.level}!
        </div>

    `;

    document.body.appendChild(box);

    setTimeout(
        ()=>box.remove(),
        1800
    );

}


/* =====================================
   HOME
===================================== */

function showHome(){

    clearInterval(timer);

    document
        .getElementById("game")
        .classList.add("hidden");

    document
        .getElementById("home")
        .classList.remove("hidden");

    window.scrollTo(0,0);

}


/* =====================================
   RESET
===================================== */

function resetGame(){

    if(
        !confirm(
            "Reset this game? All progress will be deleted."
        )
    ){
        return;
    }

    state =
        newState();

    save();

    render();

}


/* =====================================
   START APP
===================================== */

buildCards();

</script>
